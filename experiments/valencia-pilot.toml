# First experiment (docs/experiments.md): does a vision-language model beat the OSM-tag prior,
# and does the regional construction history help? Ciutat Vella, 89 Mapillary panoramas. Run with:
#   uv run city-analyser-download --tiled-bbox=-0.3800,39.4715,-0.3735,39.4770 --output data/valencia-ciutat-vella \
#     --max-images 500 --min-spacing-m 10 --image-size 2048
#   BUILDING_ANALYSIS_MODEL=balanced BUILDING_ANALYSIS_TILE_SIZE=384 uv run city-analyser-analyze valencia-ciutat-vella
#   uv run city-analyser-groundtruth catastro valencia-ciutat-vella
#   uv run city-analyser-experiment run experiments/valencia-pilot.toml
name = "valencia-pilot"
dataset = "valencia-ciutat-vella"
truth = ["catastro", "evaluation_set", "osm_tags"]
buildings = "with_truth"
limit = 40                      # first pass, about 2 h on CPU; remove it to finish (runs resume)

# The settings the dataset was analyzed with (make presentation-data, city-analyser-analyze):
# analyses made with other BUILDING_ANALYSIS_* settings do not count, so without these no building has crops.
[analysis]
BUILDING_ANALYSIS_MODEL = "balanced"
BUILDING_ANALYSIS_TILE_SIZE = "384"

[[runs]]
id = "prior"
kind = "prior"

[[runs]]
id = "qwen35-4b"
kind = "vlm"
backend = "openai"
url = "http://127.0.0.1:11434"
model = "qwen3.5:4b"
options = { reasoning_effort = "none" }

[[runs]]
id = "qwen35-4b-no-region"
kind = "vlm"
backend = "openai"
url = "http://127.0.0.1:11434"
model = "qwen3.5:4b"
options = { reasoning_effort = "none" }
regional_guidance = false

# Claude Opus 5.5 answering the same prompt for every crop by hand in a session, written to the dataset
# through VLMProvider so validation and pooling are the same as for the other runs.
[[runs]]
id = "claude-opus-5-5"
kind = "saved"
provider = "vlm:claude-opus-5-5"

# Answers already in a dataset, e.g. a Colab survey imported with city-analyser-results:
